<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bunny & Mutu" />
  <meta name="theme-color" content="#1e0b2b" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/833/833472.png" />
  <title>Bunny & Mutu — Our Private World</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #2e1042 0%, #12071c 60%, #09030f 100%);
      color: #f8fafc;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: 85px;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .rose-gradient {
      background: linear-gradient(135deg, #f43f5e 0%, #db2777 50%, #9333ea 100%);
    }
    .hot-gradient {
      background: linear-gradient(135deg, #dc2626 0%, #e11d48 50%, #7e22ce 100%);
    }
    .gold-rose-gradient {
      background: linear-gradient(135deg, #fb7185 0%, #f59e0b 100%);
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.16); }
      45% { transform: scale(0.96); }
      65% { transform: scale(1.12); }
    }
    .heart-pulse {
      animation: heartbeat 1.4s infinite ease-in-out;
    }
    @keyframes popSticker {
      0% { transform: scale(0.6) rotate(-4deg); opacity: 0; }
      70% { transform: scale(1.05) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .sticker-card-anim {
      animation: popSticker 0.35s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.4); opacity: 0; }
    }
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      animation: floatUp 1.8s ease-out forwards;
    }
  </style>
</head>
<body class="antialiased selection:bg-rose-500 selection:text-white">

  <!-- EXCLUSIVE 2-ACCOUNT LOGIN + FACE ID SCREEN -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-5 bg-[#11061a] overflow-y-auto">
    <div class="glass-panel rounded-3xl max-w-sm w-full p-6 sm:p-7 shadow-2xl border border-rose-500/25 space-y-5">
      <div class="text-center">
        <div class="w-16 h-16 rounded-3xl rose-gradient flex items-center justify-center mx-auto shadow-2xl shadow-rose-500/35 mb-3 heart-pulse">
          <i class="fa-solid fa-heart text-2xl text-white"></i>
        </div>
        <h1 class="serif-title text-2xl font-bold text-white tracking-wide">Bunny & Mutu</h1>
        <p class="text-xs text-rose-200/75 mt-1">Strictly Private • Only For Shaban & Reshu</p>
      </div>

      <!-- Face ID Quick Unlock Button -->
      <div id="faceIdQuickBox" class="hidden">
        <button type="button" onclick="unlockWithFaceID()"
          class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-95 text-white font-extrabold text-sm shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2.5 active:scale-95 transition">
          <i class="fa-solid fa-face-smile text-lg"></i>
          <span id="faceIdBtnLabel">Unlock with Face ID</span>
        </button>
        <div class="flex items-center gap-2 my-3">
          <div class="h-px bg-white/15 flex-1"></div>
          <span class="text-[10px] uppercase tracking-wider text-slate-400">or sign in with passcode</span>
          <div class="h-px bg-white/15 flex-1"></div>
        </div>
      </div>

      <!-- Quick Profile Selector Pills -->
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" id="pickBunnyBtn" onclick="selectLoginAccount('bunny')"
          class="p-3 rounded-2xl border border-indigo-400 bg-indigo-500/20 text-center transition">
          <div class="text-2xl mb-0.5">🐰</div>
          <div class="text-xs font-extrabold text-white">Bunny</div>
          <div class="text-[10px] text-indigo-200">Shaban</div>
        </button>
        <button type="button" id="pickReshuBtn" onclick="selectLoginAccount('reshu')"
          class="p-3 rounded-2xl border border-white/15 bg-white/5 text-center transition">
          <div class="text-2xl mb-0.5">👸🏻</div>
          <div class="text-xs font-extrabold text-white">Mutu</div>
          <div class="text-[10px] text-rose-200">Reshu</div>
        </button>
      </div>

      <form id="coupleLoginForm" class="space-y-3.5">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-rose-200 mb-1">Account ID</label>
          <div class="relative">
            <i class="fa-solid fa-user-heart absolute left-3.5 top-1/2 -translate-y-1/2 text-rose-300 text-xs"></i>
            <input type="text" id="loginUserId" value="bunny" required autocomplete="off"
              class="w-full pl-9 pr-3 py-3 rounded-xl bg-white/10 border border-white/15 text-sm font-bold text-white focus:outline-none focus:ring-2 focus:ring-rose-500" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-rose-200 mb-1">Secret Passcode</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-rose-300 text-xs"></i>
            <input type="password" id="loginPasscode" inputmode="numeric" required placeholder="••••"
              class="w-full pl-9 pr-3 py-3 rounded-xl bg-white/10 border border-white/15 text-sm font-bold text-white tracking-widest focus:outline-none focus:ring-2 focus:ring-rose-500" />
          </div>
        </div>

        <div id="loginErrorMsg" class="hidden text-xs text-rose-300 bg-rose-950/80 border border-rose-500/40 p-2.5 rounded-xl text-center font-semibold"></div>

        <button type="submit"
          class="w-full py-3.5 rounded-2xl rose-gradient text-white font-extrabold text-sm shadow-lg shadow-rose-500/30 flex items-center justify-center gap-2 active:scale-95 transition">
          <span>Enter Our World</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="text-center pt-1">
        <p class="text-[10px] text-slate-400">
          <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i>2-Person Encrypted Access Only
        </p>
      </div>
    </div>
  </div>

  <!-- MAIN COUPLE APP -->
  <div id="coupleApp" class="hidden max-w-lg mx-auto px-4 pt-4 space-y-4">

    <!-- TOP BAR -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl rose-gradient flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-heart text-white text-base"></i>
        </div>
        <div>
          <h1 class="serif-title text-lg font-bold leading-tight text-white">Bunny & Mutu</h1>
          <div class="flex items-center gap-1.5 text-[11px] text-emerald-300 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
            <span id="activeProfileTag">Logged in as Bunny</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="setupFaceIdBtn" onclick="registerFaceID()" title="Setup Face ID"
          class="px-2.5 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400/30 text-[11px] font-bold text-emerald-300 flex items-center gap-1">
          <i class="fa-solid fa-face-smile"></i> <span id="faceIdSetupText">Face ID</span>
        </button>
        <button onclick="switchTab('chat')" class="px-3 py-1.5 rounded-xl rose-gradient text-[11px] font-extrabold text-white shadow flex items-center gap-1">
          <i class="fa-solid fa-fire"></i> Chat
        </button>
        <button onclick="logoutAndLock()" title="Logout & Lock" class="w-8 h-8 rounded-xl glass-panel text-xs text-rose-300 flex items-center justify-center">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- TAB 1: HOME (LIVE MOOD + HEARTBEAT + COUNTDOWN) -->
    <section id="tab-home" class="space-y-4">

      <div class="grid grid-cols-2 gap-3">
        <div class="glass-panel rounded-3xl p-4 relative overflow-hidden">
          <div class="
